project: neo
version: v0.1
model:
  architecture: compact_bidirectional_transformer_encoder
  parameters_target: 150000000
  layers: 12
  hidden_size: 768
  attention_heads: 12
  intermediate_size: 3072
  max_sequence_length: 1024
  dropout: 0.1
  decision_types: [choice, score, noul]
  max_questions_per_request: 8
  max_choice_options: 32
  max_score_levels: 5
training:
  method: RLCD
  from_scratch: true
  customer_finetuning: false
  adapters: false
  synthetic_only_initially: true
  decisions_total: 1000000
  records_target: 400000
  split:
    train: 0.8
    calibration: 0.1
    test: 0.1
  precision: bf16
  gradient_checkpointing: true
  seed: 20261002
data:
  languages: [en, ar, ar-eg]
  tool_count_target: 20
  include_unknowable_cases: true
  include_option_permutation: true
  include_paraphrase_consistency: true
evaluation:
  metrics: [accuracy, macro_f1, nll, brier, ece, selective_accuracy, abstention_rate, latency, throughput]
deployment:
  workspace: /mnt/opet-data/neo
  api_contract: /v1/systemone
