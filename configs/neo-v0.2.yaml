project: neo
version: v0.2
model:
  architecture: compact_bidirectional_transformer_encoder
  parameters: 110000000
  layers: 8
  hidden_size: 512
  attention_heads: 8
  intermediate_size: 2048
  max_sequence_length: 1024
  tokenizer: bert-base-uncased
  decision_types: [choice, score, noul]
  max_choice_options: 32
training:
  method: RLCD-inspired weighted soft-target training
  from_scratch: true
  epochs: 5
  expected_steps: 62515
  learning_rate: 0.0002
  choice_loss_weight: 4.0
  score_loss_weight: 1.0
  noul_loss_weight: 1.0
  decisions_total: 1000000
  split: {train: 0.8, calibration: 0.1, test: 0.1}
  precision: bf16
  seed: 20261003
data:
  languages: [en]
  language_policy: English-only
focus:
  - tool and action selection
  - held-out option combinations
  - calibrated abstention when confidence is low
